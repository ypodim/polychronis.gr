<style>
#result > div {
  text-decoration-line: underline;
  text-decoration-style: wavy;
  text-decoration-color: red;
  display: inline-block;
}
#input {
  height: 70px;
  background: #f5f5f5;
  border: 1px solid #ddd;
  padding: 5px;
}
[placeholder]:empty::before {
    content: attr(placeholder);
    color: #555;
}
[placeholder]:empty:focus::before {
    content: "";
}
#token { margin: 5px; }
</style>

<input id="token" value=""></input>
<div>input</div>
<div id="input" placeholder="type something here..." contenteditable="true"></div>
<div>output</div>
<div id="result"></div>

<script>
$(document).ready(function() {
  $("#input").on("input", function(arg){
    var element = $(this);
    var token = $("#token").val();

    val = element.html();
    data = {text: val, token: token};
    $.post("https://node.polychronis.gr/a", data, function(resp){
      // console.log(resp)
      $("#result").html(resp.result);
    });
  });
  $("#input").focusout(function(){
    var element = $(this);
    if (!element.text().replace(" ", "").length) {
      element.empty();
    }
  });
});
</script>
